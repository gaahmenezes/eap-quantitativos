name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eapq
          POSTGRES_PASSWORD: eapq_ci
          POSTGRES_DB: eapq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eapq" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eapq:eapq_ci@localhost:5432/eapq_test
      TEST_DATABASE_URL: postgresql://eapq:eapq_ci@localhost:5432/eapq_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eapq/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @eapq/web exec playwright install --with-deps chromium
      - run: pnpm e2e
