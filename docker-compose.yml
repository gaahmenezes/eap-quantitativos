# Banco de desenvolvimento local. Credenciais apenas para uso local.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eapq
      POSTGRES_PASSWORD: eapq_dev
      POSTGRES_DB: eapq_dev
    ports: ['5432:5432']
    volumes:
      - eapq-db:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eapq']
      interval: 5s
      retries: 10
volumes:
  eapq-db:
